<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت نئونی من</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;
display:flex;align-items:center;justify-content:center;
font-family:Tahoma,Arial,sans-serif;
color:white;text-align:center;
background:radial-gradient(ellipse at top,#24104b,#080814 65%);
}
.card{
width:90%;max-width:500px;padding:38px 24px;
border:1px solid #b44cff;border-radius:25px;
background:#ffffff08;
box-shadow:0 0 25px #9b30ff55,inset 0 0 20px #9b30ff15;
}
h1{color:#dc9cff;text-shadow:0 0 15px #b52cff}
p{color:#d8d3e8;line-height:2}
a{
display:inline-block;margin-top:18px;padding:13px 25px;
border:1px solid #00f0ff;border-radius:12px;
color:#00f0ff;text-decoration:none;
box-shadow:0 0 15px #00f0ff33;
}
a:hover{background:#00f0ff;color:#080814}
small{display:block;margin-top:28px;color:#888}
</style>
</head>
<body>
<div class="card">
<h1>⚡ به سایت من خوش اومدی ⚡</h1>
<p>این سایت شخصی نئونی منه!</p>
<p>به دنیای بنفش و آبی خوش اومدی 💜</p>
<a href="https://github.com/masihollah00">گیت‌هاب من</a>
<small>ساخته شده با ❤️ و HTML</small>
</div>
</body>
</html>
